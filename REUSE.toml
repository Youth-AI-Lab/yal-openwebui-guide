version = 1
SPDX-PackageName = "yal-openwebui-guide"
SPDX-PackageSupplier = "Youth AI Lab (Erasmus+)"
SPDX-PackageDownloadLocation = "https://github.com/Youth-AI-Lab/yal-openwebui-guide"

# Texts, templates and screenshots: CC BY-SA 4.0. The screenshots show the interface of
# Open WebUI (https://github.com/open-webui/open-webui), which belongs to its authors.
[[annotations]]
path = ["README.md", "templates/**", "images/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Configuration files: EUPL-1.2.
[[annotations]]
path = [".devcontainer/**", ".vscode/**", ".gitignore", ".gitattributes", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "EUPL-1.2"
